<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Project Information Form | Hummusheikhs Ventures</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { brand: { 900: '#0F172A' } }, fontFamily: { sans: ['Inter', 'sans-serif'], serif: ['Playfair Display', 'serif'] } } }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    @page { size: A4; margin: 0; }
    body { font-family: 'Inter', sans-serif; background: #f1f5f9; -webkit-print-color-adjust: exact; color-adjust: exact; }
    .a4-container { max-width: 900px; width: 100%;  margin: 80px auto; background: white; padding: 40px 24px; box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1); position: relative; }
    @media print { body { background: white; margin: 0; } .a4-container { margin: 0; box-shadow: none; padding: 15mm; width: 100%; min-height: auto; } .no-print { display: none !important; } input, textarea { border: none !important; background: transparent; resize: none; border-bottom: 1px dashed #cbd5e1 !important; padding: 0 !important; font-family: 'Inter', sans-serif;} }
    input[type="text"], textarea { width: 100%; border: none; border-bottom: 1px dashed #cbd5e1; background: transparent; padding: 4px 0; outline: none; font-size: 1.05rem; }
    input[type="text"]:focus, textarea:focus { border-bottom-color: #d4af37; }
    .checkbox-label { display: flex; align-items: center; gap: 0.5rem; font-size: 1.05rem; color: #475569; }
    input[type="checkbox"] { accent-color: #d4af37; width: 1rem; height: 1rem; }
  </style>
</head>
<body class="text-slate-800">
  <div class="fixed top-4 right-4 no-print flex gap-4">
    <a href="onboarding.html" class="bg-white text-slate-800 px-4 py-2 border border-slate-300 rounded shadow-sm hover:bg-slate-50 transition text-sm font-medium">← Back to Hub</a>
    <button onclick="window.print()" class="bg-brand-900 text-white px-4 py-2 rounded shadow-sm hover:bg-slate-800 transition text-sm font-medium">Download / Print PDF</button>
  </div>

  <div class="a4-container">
    <header class="flex justify-between items-start border-b-2 border-brand-900 pb-6 mb-8">
      <div class="flex items-center gap-4">
        <img src="assets/img/logo-hummusheikhs-ventures.jpg" alt="Logo" class="w-16 h-16 object-contain rounded-sm" onerror="this.style.display='none'">
        <div>
          <h1 class="font-serif text-2xl font-bold text-brand-900 tracking-tight uppercase">Hummusheikhs Ventures</h1>
          <p class="text-[10px] text-slate-500 mt-1 uppercase tracking-wider font-semibold">Building Ideas. Creating Value. Inspiring Business Growth.</p>
        </div>
      </div>
      <div class="text-right text-[10px] text-slate-600 space-y-1">
        <p><strong>E:</strong> humusheiksventures@gmail.com</p>
        <p><strong>W:</strong> +234 803 950 6249</p>
        <p><strong>URL:</strong> hummusheikhsventures.netlify.app</p>
      </div>
    </header>

    <h2 class="text-xl font-bold text-brand-900 mb-6 uppercase tracking-wider">Client Project Information</h2>
    <form name="onboarding" method="POST" data-netlify="true" action="onboarding.html">
    
    <div class="grid grid-cols-2 gap-x-8 gap-y-4 mb-6">
      <div>
        <label class="block text-[10px] font-bold text-slate-800 mb-1 uppercase tracking-wider">Client Name</label>
        <input type="text" name="client_name" placeholder="Enter full name" required />
      </div>
      <div>
        <label class="block text-[10px] font-bold text-slate-800 mb-1 uppercase tracking-wider">Business Name</label>
        <input type="text" name="business_name" placeholder="Enter business name" />
      </div>
      <div>
        <label class="block text-[10px] font-bold text-slate-800 mb-1 uppercase tracking-wider">Email Address</label>
        <input type="email" name="email" placeholder="Enter email" required />
      </div>
      <div>
        <label class="block text-[10px] font-bold text-slate-800 mb-1 uppercase tracking-wider">Phone / WhatsApp</label>
        <input type="tel" name="phone" placeholder="Enter phone number" required />
      </div>
    </div>

    <div class="space-y-4 mb-6">
      <div>
        <label class="block text-[10px] font-bold text-slate-800 mb-1 uppercase tracking-wider">Website Purpose</label>
        <textarea rows="2" placeholder="Briefly describe the main goal of the website..." name="notes"></textarea>
      </div>
      <div>
        <label class="block text-[10px] font-bold text-slate-800 mb-1 uppercase tracking-wider">Target Audience</label>
        <textarea rows="2" placeholder="Who are your primary customers?" name="notes"></textarea>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-x-8 gap-y-6 mb-6">
      <div>
        <label class="block text-[10px] font-bold text-slate-800 mb-2 uppercase tracking-wider">Logo Availability</label>
        <div class="space-y-2">
          <label class="checkbox-label"><input type="checkbox" name="logo_status" value="Ready"> We have a high-res logo ready</label>
          <label class="checkbox-label"><input type="checkbox" name="logo_status" value="Need Design"> We need a new logo designed</label>
        </div>
      </div>
      <div>
        <label class="block text-[10px] font-bold text-slate-800 mb-2 uppercase tracking-wider">Preferred Colours</label>
        <textarea rows="2" placeholder="List brand colors..." name="notes"></textarea>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-x-8 gap-y-6 mb-6">
      <div>
        <label class="block text-[10px] font-bold text-slate-800 mb-2 uppercase tracking-wider">Features Required</label>
        <div class="space-y-2">
          <label class="checkbox-label"><input type="checkbox" name="features[]" value="Contact Form"> Contact / Booking Form</label>
          <label class="checkbox-label"><input type="checkbox" name="features[]" value="E-Commerce"> E-Commerce / Store</label>
          <label class="checkbox-label"><input type="checkbox" name="features[]" value="Blog"> CMS / Blog</label>
          <label class="checkbox-label"><input type="checkbox" name="features[]" value="Gallery"> Gallery / Portfolio</label>
          <label class="checkbox-label"><input type="checkbox" name="features[]" value="Portal"> Client Portal / Login</label>
        </div>
      </div>
      <div>
        <label class="block text-[10px] font-bold text-slate-800 mb-2 uppercase tracking-wider">Infrastructure & Content</label>
        <div class="space-y-2">
          <label class="checkbox-label"><input type="checkbox" name="infrastructure[]" value="Domain"> Domain Name Available</label>
          <label class="checkbox-label"><input type="checkbox" name="infrastructure[]" value="Hosting"> Web Hosting Setup Required</label>
          <label class="checkbox-label"><input type="checkbox" name="infrastructure[]" value="Content"> Content (Text/Images) Ready</label>
          <label class="checkbox-label"><input type="checkbox" name="infrastructure[]" value="SEO"> Advanced SEO Required</label>
        </div>
      </div>
    </div>
      
      
    

    <div class="space-y-4 mb-6">
      <div>
        <label class="block text-[10px] font-bold text-slate-800 mb-1 uppercase tracking-wider">Competitor Websites</label>
        <textarea rows="2" placeholder="List 2-3 links of websites you like..." name="notes"></textarea>
      </div>
      <div>
        <label class="block text-[10px] font-bold text-slate-800 mb-1 uppercase tracking-wider">Pages Required</label>
        <textarea rows="2" placeholder="e.g. Home, About Us, Services, Contact..." name="pages_required"></textarea>
      </div>
      <div>
        <label class="block text-[10px] font-bold text-slate-800 mb-1 uppercase tracking-wider">Additional Notes</label>
        <textarea rows="2" placeholder="Any other specific requirements..." name="notes"></textarea>
      </div>
    </div>

          <div class="mt-8 pt-8 border-t border-slate-200 no-print flex justify-end">
        <button type="submit" class="bg-[#d4af37] text-white px-6 py-3 rounded shadow hover:bg-[#c9a24b] transition font-medium">Submit Project Form</button>
      </div>
    </form>
<footer class="mt-8 pt-6 border-t border-slate-200 text-[9px] text-slate-400 text-center uppercase tracking-wider absolute bottom-[20mm] left-[20mm] right-[20mm]">
      HUMMUSHEIKHS VENTURES &bull; Bank: Adetoro Sururat Olatayo GTBank 0012731393
    </footer>
      
    
  </div>
</body>
</html>
