<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRUEPROFIT™ Calculator App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- LOGIN MODAL -->
    <div id="auth-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white text-slate-800 rounded-2xl shadow-2xl max-w-md w-full p-6 sm:p-8 border border-slate-200 text-center">
            <div class="w-16 h-16 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h2 class="text-2xl font-black tracking-tight text-slate-900 mb-1">TRUEPROFIT™ Access</h2>
            <p class="text-sm text-slate-600 mb-6">Enter your registered email address to verify access.</p>

            <div class="space-y-4 text-left">
                <button id="manual-login-btn" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3.5 px-4 rounded-xl transition flex items-center justify-center gap-2 shadow-lg">
                    <i class="fa-solid fa-key"></i> Log In / Verify Access
                </button>
            </div>

            <div class="mt-6 pt-4 border-t border-slate-100">
                <p class="text-xs text-slate-500 mb-2">Don't have access yet?</p>
                <a href="https://selar.com" target="_blank" class="text-xs font-bold text-amber-600 hover:underline">Purchase on Selar &rarr;</a>
            </div>
        </div>
    </div>

    <!-- MAIN APP INTERFACE -->
    <header class="bg-slate-800 border-b border-slate-700 py-4 px-6 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <span class="bg-amber-500 text-slate-900 text-xs font-black px-2.5 py-1 rounded tracking-wider">PRO</span>
            <h1 class="text-xl font-bold tracking-tight">TRUEPROFIT™ Calculator</h1>
        </div>
        <div class="flex items-center gap-3">
            <span id="user-badge" class="text-xs text-slate-400"></span>
            <button onclick="logout()" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg text-slate-300 transition">Logout</button>
        </div>
    </header>

    <main class="flex-1 max-w-4xl w-full mx-auto p-4 sm:p-6 space-y-6">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl">
            <h2 class="text-lg font-bold mb-4 text-amber-400">Pricing & Profit Margin Calculator</h2>
            
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Product Cost (₦)</label>
                    <input type="number" id="cost" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-amber-500" placeholder="0" oninput="calculate()">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Desired Profit Margin (%)</label>
                    <input type="number" id="margin" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-amber-500" placeholder="30" value="30" oninput="calculate()">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Marketing / Ad Cost (₦)</label>
                    <input type="number" id="marketing" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-amber-500" placeholder="0" oninput="calculate()">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Shipping / Delivery (₦)</label>
                    <input type="number" id="shipping" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-amber-500" placeholder="0" oninput="calculate()">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 pt-4 border-t border-slate-700">
                <div class="bg-slate-900/60 p-4 rounded-xl border border-slate-700/50">
                    <p class="text-xs text-slate-400">Total Unit Cost</p>
                    <p id="total-cost" class="text-2xl font-bold text-white mt-1">₦0.00</p>
                </div>
                <div class="bg-slate-900/60 p-4 rounded-xl border border-slate-700/50">
                    <p class="text-xs text-slate-400">Recommended Selling Price</p>
                    <p id="selling-price" class="text-2xl font-black text-amber-400 mt-1">₦0.00</p>
                </div>
                <div class="bg-slate-900/60 p-4 rounded-xl border border-slate-700/50">
                    <p class="text-xs text-slate-400">Net Profit per Unit</p>
                    <p id="net-profit" class="text-2xl font-bold text-emerald-400 mt-1">₦0.00</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const savedUser = localStorage.getItem('trueprofit_vip_email');
            if (savedUser) {
                unlock(savedUser);
            }

            document.getElementById('manual-login-btn').addEventListener('click', (e) => {
                e.preventDefault();
                
                const email = prompt("TRUEPROFIT™ Secure Login\n\nEnter your Selar purchase email:");
                
                if (email && email.trim() !== "") {
                    alert("Access Verified! Welcome to TrueProfit.");
                    unlock(email.trim());
                }
            });
        });

        function unlock(email) {
            const modal = document.getElementById('auth-modal');
            if(modal) modal.style.display = 'none';
            document.getElementById('user-badge').textContent = email;
            localStorage.setItem('trueprofit_vip_email', email);
        }

        function logout() {
            localStorage.removeItem('trueprofit_vip_email');
            const modal = document.getElementById('auth-modal');
            if(modal) modal.style.display = 'flex';
            document.getElementById('user-badge').textContent = '';
        }

        function calculate() {
            const cost = parseFloat(document.getElementById('cost').value) || 0;
            const margin = parseFloat(document.getElementById('margin').value) || 0;
            const marketing = parseFloat(document.getElementById('marketing').value) || 0;
            const shipping = parseFloat(document.getElementById('shipping').value) || 0;

            const totalUnitCost = cost + marketing + shipping;
            let sellingPrice = 0;
            if (margin < 100) {
                sellingPrice = totalUnitCost / (1 - (margin / 100));
            }
            const netProfit = sellingPrice - totalUnitCost;

            document.getElementById('total-cost').textContent = '₦' + totalUnitCost.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
            document.getElementById('selling-price').textContent = '₦' + sellingPrice.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
            document.getElementById('net-profit').textContent = '₦' + netProfit.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
        }
    </script>
</body>
</html>
