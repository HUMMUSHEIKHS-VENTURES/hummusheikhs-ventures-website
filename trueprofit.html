<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrueProfit VIP Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">
    
    <!-- Login Screen -->
    <div id="login-screen" class="bg-white p-8 rounded-xl shadow-lg max-w-md w-full mx-4 border-t-4 border-blue-600">
        <h2 class="text-2xl font-bold text-center mb-2 text-gray-800">TrueProfit Access</h2>
        <p class="text-center text-gray-500 mb-6 text-sm">Secure VIP Master Key Authentication</p>
        
        <div id="error-message" class="hidden bg-red-100 text-red-600 p-3 rounded mb-4 text-sm text-center font-semibold"></div>
        
        <form id="login-form" class="space-y-5">
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">Admin Email</label>
                <input type="email" id="email" class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter hummuahmad@gmail.com" required>
            </div>
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">Password</label>
                <input type="password" id="password" class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter any password" required>
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition">
                Secure Login
            </button>
        </form>
    </div>

    <!-- Hidden Dashboard Screen -->
    <div id="dashboard-screen" class="hidden bg-white p-8 rounded-xl shadow-lg max-w-4xl w-full mx-4">
        <h1 class="text-3xl font-bold text-gray-800 mb-2">Welcome, CEO!</h1>
        <p class="text-gray-600 mb-8">Your TrueProfit dashboard is active and live.</p>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-blue-50 p-6 rounded-lg border border-blue-100">
                <h3 class="font-bold text-blue-800">Total Revenue</h3>
                <p class="text-3xl font-black text-blue-600 mt-2">$0.00</p>
            </div>
            <div class="bg-green-50 p-6 rounded-lg border border-green-100">
                <h3 class="font-bold text-green-800">Active Sales</h3>
                <p class="text-3xl font-black text-green-600 mt-2">0</p>
            </div>
            <div class="bg-purple-50 p-6 rounded-lg border border-purple-100">
                <h3 class="font-bold text-purple-800">Analytics Status</h3>
                <p class="text-3xl font-black text-purple-600 mt-2">LIVE</p>
            </div>
        </div>
        
        <button onclick="logout()" class="mt-8 text-red-600 hover:underline font-bold">Lock Dashboard & Logout</button>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim().toLowerCase();
            
            // THE VIP MASTER KEY LOGIC
            if (email === 'hummuahmad@gmail.com') {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('dashboard-screen').classList.remove('hidden');
            } else {
                const errorDiv = document.getElementById('error-message');
                errorDiv.textContent = "Access Denied: You are not the authorized CEO.";
                errorDiv.classList.remove('hidden');
            }
        });

        function logout() {
            document.getElementById('email').value = '';
            document.getElementById('password').value = '';
            document.getElementById('dashboard-screen').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('error-message').classList.add('hidden');
        }
    </script>
</body>
</html>
