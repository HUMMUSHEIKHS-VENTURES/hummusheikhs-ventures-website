[build]
  command = "python3 restore_protected_files.py && python3 build.py && rm -f restore_protected_files.py .restore/trueprofit-app.html.gz.b64 .restore/trueprofit.html.gz.b64"
  publish = "."

[build.environment]
  PYTHON_VERSION = "3.11"

# Netlify automatically serves 404.html for unmatched pages since it sits
# at the root of the published site, no extra redirect rule needed.

[[redirects]]
  from = "/trueprofit_original.html"
  to = "/404.html"
  status = 404
# Trigger the connected Netlify rebuild from main.
